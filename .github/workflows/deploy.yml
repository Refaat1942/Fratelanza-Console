name: Build & Deploy to Hostinger VPS

on:
  
  
  workflow_dispatch:

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.image-meta.outputs.registry }}
      image_tag: ${{ steps.image-meta.outputs.image_tag }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: image-meta
        shell: bash
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ steps.image-meta.outputs.registry }}/fratelanza-api:${{ steps.image-meta.outputs.image_tag }}
            ${{ steps.image-meta.outputs.registry }}/fratelanza-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ steps.image-meta.outputs.registry }}/fratelanza-web:${{ steps.image-meta.outputs.image_tag }}
            ${{ steps.image-meta.outputs.registry }}/fratelanza-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    env:
      REGISTRY: ${{ needs.build.outputs.registry }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: mkdir -p /opt/fratelanza

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/fratelanza

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: REGISTRY,IMAGE_TAG
          script: |
            set -e
            cd /opt/fratelanza

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export REGISTRY=$REGISTRY
            export IMAGE_TAG=$IMAGE_TAG
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            export SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            export ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
            export ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}

            docker compose pull
            docker compose up -d --remove-orphans

            docker image prune -f
            echo "Deploy complete — $(date)"
