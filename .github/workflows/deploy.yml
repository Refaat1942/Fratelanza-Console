name: Deploy Management Console to Hostinger VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS (/opt/fratelanza-console)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy console files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,nginx.conf,scripts/deploy-console-vps.sh"
          target: /opt/fratelanza-console

      - name: Build and deploy console on VPS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            chmod +x /opt/fratelanza-console/scripts/deploy-console-vps.sh
            /opt/fratelanza-console/scripts/deploy-console-vps.sh
