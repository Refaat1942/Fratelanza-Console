kind = "web"
previewPath = "/"
title = "Fratelanza Management Console"
version = "1.0.0"
id = "artifacts/fratelanza"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18584

[services.development]
run = "pnpm --filter @workspace/fratelanza run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fratelanza", "run", "build" ]
publicDir = "artifacts/fratelanza/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18584"
BASE_PATH = "/"
