name: fratelanza-console

services:
  db:
    image: postgres:16-alpine
    container_name: fratelanza-console-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fratelanza_console
      POSTGRES_USER: fratelanza_console
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fratelanza_console"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${REGISTRY:-ghcr.io/refaat1942}/fratelanza-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fratelanza-console-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://fratelanza_console:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/fratelanza_console
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      NODE_ENV: production
      PORT: 8080
    networks:
      - internal
    ports:
      - "127.0.0.1:3101:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${REGISTRY:-ghcr.io/refaat1942}/fratelanza-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: fratelanza-console-web
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "127.0.0.1:3100:80"
    depends_on:
      - api

networks:
  internal:
    name: fratelanza-console-net
    driver: bridge

volumes:
  pgdata:
    name: fratelanza_console_pgdata
